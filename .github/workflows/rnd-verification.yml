name: R&D verification
on:
  push:
    branches: ['rnd/position-freshness-2026-09-25']
  pull_request:
    paths:
      - 'packages/engine/**'
      - 'apps/**'
      - 'app/**'
      - 'src/**'
      - 'tools/mesh-rnd/**'
      - 'docs/programme/**'
      - '.github/workflows/rnd-verification.yml'
permissions:
  contents: read
concurrency:
  group: rnd-verification-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Preserve exact source snapshot
        run: |
          mkdir -p /tmp/loc8-evidence
          git rev-parse HEAD > /tmp/loc8-evidence/commit.txt
          git archive --format=tar HEAD > /tmp/loc8-evidence/source.tar
      - uses: actions/upload-artifact@v4
        with:
          name: loc8-source-${{ github.sha }}
          path: /tmp/loc8-evidence/
          retention-days: 7
      - uses: actions/setup-node@v4
        with:
          node-version: '22.18.0'
          cache: npm
      - name: Install exact repository dependencies
        id: install
        shell: bash
        run: |
          mkdir -p /tmp/loc8-ci-diagnostics
          node --version > /tmp/loc8-ci-diagnostics/toolchain.txt
          npm --version >> /tmp/loc8-ci-diagnostics/toolchain.txt
          npm ci > /tmp/loc8-ci-diagnostics/npm-ci.log 2>&1 || {
            tail -n 100 /tmp/loc8-ci-diagnostics/npm-ci.log
            exit 1
          }
      - name: Preserve dependency diagnostics
        if: ${{ always() && steps.install.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: loc8-install-diagnostics-${{ github.sha }}
          path: /tmp/loc8-ci-diagnostics/
          retention-days: 7
      - name: Shared BLE regression checks
        run: node --test tools/mesh-rnd/verify.node.cjs
      - name: Position freshness checks
        run: node --test tools/mesh-rnd/freshness.node.cjs
      - name: Source sample and programme checks
        run: node --test tools/mesh-rnd/source-location.node.cjs tools/mesh-rnd/programme.node.cjs
      - name: Existing Jest suite
        run: npm test -- --runInBand
      - name: Root TypeScript
        run: npx tsc --noEmit
      - name: Lint
        run: npm run lint
