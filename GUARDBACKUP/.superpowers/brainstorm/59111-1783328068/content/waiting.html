<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    background:radial-gradient(1200px 800px at 50% -10%, #241a3a, #0a0b12 55%);
    color:#fff;min-height:100vh;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px}
  h1{font-size:22px;font-weight:800}h1 b{background:linear-gradient(90deg,#ff5a8c,#ff9a5a);-webkit-background-clip:text;background-clip:text;color:transparent}
  p{opacity:.55;font-size:14px}
  .d{display:flex;gap:8px;margin-top:8px}.d span{width:8px;height:8px;border-radius:50%;background:#ff5a8c;animation:b 1.2s infinite}
  .d span:nth-child(2){animation-delay:.2s}.d span:nth-child(3){animation-delay:.4s}
  @keyframes b{0%,100%{opacity:.25;transform:translateY(0)}50%{opacity:1;transform:translateY(-5px)}}
</style></head>
<body>
  <h1><b>Loc8</b></h1>
  <p>Radar + Compass locked in ✓ &nbsp; Continuing in the terminal…</p>
  <div class="d"><span></span><span></span><span></span></div>
</body></html>
